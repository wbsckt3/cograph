<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conexión de Usuarios</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; font-family: sans-serif;
    }
    #cy {
      width: 100vw; height: 100vh;
    }
    #login, #formulario {
      position: absolute; z-index: 10;
      top: 10px; left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      max-width: 300px;
    }
    input, textarea, button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      width: 100%;
      margin-bottom: 5px;
    }
    textarea {
      resize: none;
      height: 60px;
    }
  </style>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="login">
    <div id="g_id_onload"
      data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-context="use"
      data-ux_mode="popup"
      data-auto_select="true"
      data-itp_support="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
  </div>

  <div id="formulario" style="display: none;">
    <label>¿Dónde te pueden contactar? (URL)</label>
    <input type="text" id="contactoURL" placeholder="https://wa.me/..." />
    <label>¿Qué estás ofreciendo? (máx 3 renglones)</label>
    <textarea id="descripcion" placeholder="Clases, asesorías, networking, etc."></textarea>
    <button onclick="actualizarNodo()">Actualizar estado</button>
  </div>

  <div id="cy"></div>

  <script>
    let usuario = null;
    let nodoUsuario = null;

    const cy = cytoscape({
      container: document.getElementById('cy'),
      style: [
        {
          selector: 'node',
          style: {
            'background-color': '#0074D9',
            'label': 'data(label)',
            'color': '#fff',
            'text-valign': 'center',
            'text-wrap': 'wrap',
            'text-max-width': '150px',
            'font-size': 12,
            'shape': 'roundrectangle',
            'padding': 10,
            'width': 'label',
            'height': 'label',
            'border-width': 2,
            'border-color': '#005fa3'
          }
        }
      ],
      layout: {
        name: 'grid',
        rows: 1
      }
    });

    function handleCredentialResponse(response) {
      const payload = decodeJwtResponse(response.credential);
      usuario = {
        name: payload.name,
        email: payload.email,
        picture: payload.picture
      };
      document.getElementById("login").style.display = "none";
      document.getElementById("formulario").style.display = "block";
      crearNodoInicial();
    }

    function decodeJwtResponse(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(jsonPayload);
    }

    function crearNodoInicial() {
      const contenido = `${usuario.name}\n(Sin información aún)`;
      nodoUsuario = cy.add({
        group: 'nodes',
        data: {
          id: usuario.email,
          label: contenido,
          href: ""
        },
        position: {
          x: Math.random() * 600 + 100,
          y: Math.random() * 400 + 100
        }
      });
    }

    function actualizarNodo() {
      const url = document.getElementById("contactoURL").value.trim();
      const desc = document.getElementById("descripcion").value.trim();

      if (!nodoUsuario) return;

      const nuevoContenido = `${usuario.name}\n${desc}\n(${url})`;

      nodoUsuario.data('label', nuevoContenido);
      nodoUsuario.data('href', url);
    }

    // Permite hacer clic en el nodo para abrir el enlace
    cy.on('tap', 'node', function(evt){
      const url = evt.target.data('href');
      if(url) window.open(url, '_blank');
    });
  </script>
</body>
</html>
