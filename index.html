<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cograph - Usuarios conectados</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #cy {
      width: 100%;
      height: 100%;
      display: block;
    }
    #login-info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.95);
      padding: 10px;
      border-radius: 8px;
      z-index: 10;
    }
    .g_id_signin {
      margin-top: 8px;
    }
  </style>

  <!-- Librerías -->
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Login y datos del usuario -->
  <div id="login-info">
    <div id="g_id_onload"
      data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-context="use"
      data-ux_mode="popup"
      data-auto_select="true"
      data-itp_support="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
    <h3 id="user-info">No autenticado</h3>
  </div>

  <!-- Grafo -->
  <div id="cy"></div>

  <script>
    let cy;
    let usuario = null;

    // Inicializar Cytoscape
    function inicializarCytoscape() {
      cy = cytoscape({
        container: document.getElementById('cy'),
        elements: [],
        style: [
          {
            selector: 'node',
            style: {
              'label': 'data(label)',
              'text-valign': 'center',
              'text-halign': 'center',
              'background-color': '#0074D9',
              'color': '#fff',
              'width': 'label',
              'height': 'label',
              'padding': '10px',
              'shape': 'roundrectangle',
              'text-wrap': 'wrap',
              'font-size': '12px'
            }
          },
          {
            selector: 'node:hover',
            style: {
              'background-color': '#005fa3',
              'cursor': 'pointer'
            }
          }
        ],
        layout: {
          name: 'circle'
        }
      });

      // Click sobre nodo para abrir link
      cy.on('tap', 'node', function(evt){
        const node = evt.target;
        const url = node.data('url');
        if (url) window.open(url, '_blank');
      });
    }

    // Agregar nodo de usuario
    function agregarNodo(nombre, url) {
      cy.add({
        group: 'nodes',
        data: { id: nombre, label: `${nombre}\n(${url})`, url: url },
        position: {
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight
        }
      });
    }

    // Google Sign-In
    function handleCredentialResponse(response) {
      const payload = decodeJwtResponse(response.credential);
      usuario = payload;
      localStorage.setItem('usuario', JSON.stringify(payload));
      document.getElementById("user-info").textContent = `Usuario: ${payload.email}`;
      document.getElementById("g_id_onload").style.display = "none";
      document.querySelector(".g_id_signin").style.display = "none";

      const userLink = prompt("¿Dónde quieres que los demás te contacten? (URL: Telegram, WhatsApp, Facebook, etc.)");
      agregarNodo(payload.name, userLink || "https://ejemplo.com");
    }

    function decodeJwtResponse(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(jsonPayload);
    }

    // Inicializar
    window.onload = () => {
      inicializarCytoscape();

      // Si hay sesión guardada, cargar usuario
      const user = localStorage.getItem("usuario");
      if (user) {
        const parsed = JSON.parse(user);
        document.getElementById("user-info").textContent = `Usuario: ${parsed.email}`;
        document.getElementById("g_id_onload").style.display = "none";
        document.querySelector(".g_id_signin").style.display = "none";
        const userLink = prompt("¿Dónde quieres que los demás te contacten? (URL: Telegram, WhatsApp, Facebook, etc.)");
        agregarNodo(parsed.name, userLink || "https://ejemplo.com");
      }
    };
  </script>

</body>
</html>
