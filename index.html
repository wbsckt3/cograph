<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Conexiones de Usuarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #mycanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #f0f0f0;
      touch-action: none;
    }

    #login-info {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px;
      border-radius: 8px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    input, button {
      font-size: 1rem;
      padding: 5px;
      width: 100%;
      box-sizing: border-box;
    }

    h3 {
      font-size: 1rem;
      margin: 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/litegraph.js/build/litegraph.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js/css/litegraph.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>
  <div id="login-info">
    <div id="g_id_onload"
      data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-context="use"
      data-ux_mode="popup"
      data-auto_select="true"
      data-itp_support="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
    <h3 id="user-info">No autenticado</h3>
    <input type="text" id="mensaje" placeholder="Mensaje (ej. Disponible en WhatsApp)">
    <input type="text" id="url" placeholder="URL de contacto (ej. https://wa.me/...)">
    <button onclick="enviarDatos()">Actualizar Nodo</button>
  </div>

  <canvas id="mycanvas"></canvas>

  <script>
    const graph = new LGraph();
    const canvas = new LGraphCanvas("#mycanvas", graph);
    graph.start();

    let socket = io("http://localhost:3000"); // Cambiar al deploy después

    function NodoUsuario() {
      this.addOutput("info", "string");
      this.addProperty("email", "");
      this.addProperty("mensaje", "");
      this.addProperty("url", "");
    }

    NodoUsuario.title = "Usuario";
    NodoUsuario.prototype.onDrawBackground = function(ctx) {
      ctx.fillStyle = "#222";
      ctx.fillRect(0, this.size[1] - 20, this.size[0], 20);
      ctx.fillStyle = "#fff";
      ctx.font = "10px sans-serif";
      ctx.fillText(this.properties.mensaje, 4, this.size[1] - 7);
    };

    NodoUsuario.prototype.onExecute = function () {
      this.setOutputData(0, this.properties.email);
    };

    LiteGraph.registerNodeType("custom/usuario", NodoUsuario);

    let nodoPropio = null;

    function agregarNodoUsuario(nombre, email, mensaje = "", url = "") {
      const node = LiteGraph.createNode("custom/usuario");
      node.title = nombre;
      node.pos = [Math.random() * 200 + 50, Math.random() * 200 + 50];
      node.properties.email = email;
      node.properties.mensaje = mensaje;
      node.properties.url = url;
      graph.add(node);
      return node;
    }

    function enviarDatos() {
      if (nodoPropio) {
        nodoPropio.properties.mensaje = document.getElementById("mensaje").value;
        nodoPropio.properties.url = document.getElementById("url").value;
        graph.draw();
        socket.emit("nuevo-usuario", {
          nombre: nodoPropio.title,
          email: nodoPropio.properties.email,
          mensaje: nodoPropio.properties.mensaje,
          url: nodoPropio.properties.url
        });
      }
    }

    socket.on("usuarios-actuales", (usuarios) => {
      usuarios.forEach(u => {
        if (u.email !== nodoPropio?.properties.email) {
          agregarNodoUsuario(u.nombre, u.email, u.mensaje, u.url);
        }
      });
    });

    socket.on("nuevo-usuario", (u) => {
      if (u.email !== nodoPropio?.properties.email) {
        agregarNodoUsuario(u.nombre, u.email, u.mensaje, u.url);
      }
    });

    function handleCredentialResponse(response) {
      const payload = decodeJwtResponse(response.credential);
      localStorage.setItem("usuario", JSON.stringify(payload));
      document.getElementById("user-info").textContent = `Usuario: ${payload.email}`;
      document.getElementById("g_id_onload").style.display = "none";
      document.querySelector(".g_id_signin").style.display = "none";
      nodoPropio = agregarNodoUsuario(payload.name, payload.email);
      socket.emit("nuevo-usuario", {
        nombre: payload.name,
        email: payload.email,
        mensaje: "",
        url: ""
      });
    }

    function decodeJwtResponse(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(jsonPayload);
    }
  </script>
</body>
</html>
