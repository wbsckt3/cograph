<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Usuarios con LiteGraph y Google Login</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    #mycanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #f0f0f0;
    }
    #login-info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 5px;
      z-index: 10;
    }
    #node-editor {
      display: none;
      position: absolute;
      top: 80px;
      left: 10px;
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      z-index: 20;
      border-radius: 5px;
    }
    input[type="text"] {
      width: 100%;
      margin-bottom: 5px;
    }
    button {
      margin-right: 5px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/litegraph.js/build/litegraph.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js/css/litegraph.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div id="login-info">
    <div id="g_id_onload"
      data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-context="use"
      data-ux_mode="popup"
      data-auto_select="true"
      data-itp_support="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
    <h3 id="user-info">No autenticado</h3>
  </div>

  <div id="node-editor">
    <label>Estado:</label>
    <input type="text" id="estado-input">
    <label>URL:</label>
    <input type="text" id="url-input">
    <button onclick="guardarInfoNodo()">Guardar</button>
    <button onclick="cerrarEditor()">Cerrar</button>
  </div>

  <canvas id="mycanvas" width="1200" height="700"></canvas>

  <script>
    let graph = new LGraph();
    let canvas = new LGraphCanvas("#mycanvas", graph);
    graph.start();

    function NodoUsuario() {
      this.addOutput("salida", "string");
      this.addProperty("email", "");
      this.addProperty("estado", "");
      this.addProperty("url", "");
    }

    NodoUsuario.title = "Usuario";

    NodoUsuario.prototype.onExecute = function () {
      this.setOutputData(0, this.properties.email);
    };

    NodoUsuario.prototype.onDrawForeground = function (ctx) {
      if (this.properties.estado) {
        ctx.font = "12px Arial";
        ctx.fillStyle = "#333";
        ctx.fillText(this.properties.estado, 10, this.size[1] + 14);
      }
      if (this.properties.url) {
        ctx.fillStyle = "#0077cc";
        ctx.fillText(this.properties.url, 10, this.size[1] + 28);
      }
    };

    LiteGraph.registerNodeType("custom/usuario", NodoUsuario);

    const usuarioGuardado = JSON.parse(localStorage.getItem("usuario"));
    if (usuarioGuardado) {
      agregarNodoUsuario(usuarioGuardado.name, usuarioGuardado.email);
      document.getElementById("user-info").textContent = `Usuario: ${usuarioGuardado.email}`;
      ocultarLogin();
    }

    function handleCredentialResponse(response) {
      const payload = decodeJwtResponse(response.credential);
      localStorage.setItem("usuario", JSON.stringify(payload));
      document.getElementById("user-info").textContent = `Usuario: ${payload.email}`;
      ocultarLogin();
      agregarNodoUsuario(payload.name, payload.email);
    }

    function decodeJwtResponse(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(jsonPayload);
    }

    function agregarNodoUsuario(nombre, email) {
      const node = LiteGraph.createNode("custom/usuario");
      node.title = nombre;
      node.pos = [Math.random() * 300 + 50, Math.random() * 300 + 50];
      node.properties.email = email;
      graph.add(node);
    }

    function ocultarLogin() {
      document.querySelector(".g_id_signin").style.display = "none";
      document.getElementById("g_id_onload").style.display = "none";
    }

    let nodoSeleccionado = null;

    canvas.canvas.addEventListener("dblclick", (e) => {
      const [x, y] = canvas.convertEventToCanvas(e);
      const node = graph.getNodeOnPos(x, y, 10);
      if (node && node.type === "custom/usuario") {
        nodoSeleccionado = node;
        document.getElementById("estado-input").value = node.properties.estado || "";
        document.getElementById("url-input").value = node.properties.url || "";
        document.getElementById("node-editor").style.display = "block";
      }
    });

    function guardarInfoNodo() {
      if (nodoSeleccionado) {
        nodoSeleccionado.properties.estado = document.getElementById("estado-input").value;
        nodoSeleccionado.properties.url = document.getElementById("url-input").value;
        nodoSeleccionado.title = nodoSeleccionado.properties.estado || nodoSeleccionado.title;
        canvas.draw(true, true);
      }
      cerrarEditor();
    }

    function cerrarEditor() {
      document.getElementById("node-editor").style.display = "none";
    }
  </script>
</body>
</html>
