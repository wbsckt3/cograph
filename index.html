<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Red de Conexiones Interactiva</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; font-family: sans-serif;
    }
    #cy {
      width: 100vw; height: 100vh;
    }
    #login, #formulario {
      position: absolute; z-index: 10;
      top: 10px; left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      max-width: 300px;
    }
    input, textarea, button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      width: 95%;
      margin-bottom: 5px;
    }
    textarea {
      resize: none;
      height: 60px;
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2em;
    }
  </style>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="login">
    <div id="g_id_onload"
      data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-context="use"
      data-ux_mode="popup"
      data-auto_select="true"
      data-itp_support="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
  </div>

  <div id="formulario" style="display: none;">
    <label>¿Dónde te pueden contactar? (URL)</label>
    <input type="text" id="contactoURL" placeholder="https://wa.me/..." />
    <label>¿Qué estás ofreciendo? (máx 3 renglones)</label>
    <textarea id="descripcion" placeholder="Clases, asesorías, networking, etc."></textarea>
    <button onclick="actualizarNodo()">Actualizar estado</button>
  </div>

  <div id="cy"></div>
  <div class="loading" style="display: none;">Cargando red...</div>

  <script>
    
    let cy = null; // Inicializar como null
    let currentUser = null;
    let nodos = JSON.parse(localStorage.getItem('nodos')) || {};
    let conexiones = JSON.parse(localStorage.getItem('conexiones')) || {};

    // Función de inicialización modificada
    function inicializarCytoscape() {
      // Verificar si el contenedor existe
      if (!document.getElementById('cy')) return;
      
      cy = cytoscape({
        container: document.getElementById('cy'),
        // ... (configuración de estilos anterior) ...
      });

      // Cargar datos solo si cy existe
      if (cy) {
        cargarDatosEnRed();
        configurarEventos();
        cy.layout({ name: 'cose', animate: true }).run();
      }
    }

    // Nueva función para configurar eventos
    function configurarEventos() {
      cy.on('tap', 'node', function(evt) {
        const node = evt.target;
        const href = node.data('href');
        if (href) window.open(href, '_blank');
      });

      cy.on('dbltap', 'node', function(evt) {
        const targetNode = evt.target;
        if (currentUser?.uid && targetNode.id() !== currentUser.uid) {
          crearConexion(targetNode.id());
        }
      });
    }

    // Modificar el event listener de carga
    window.addEventListener('load', () => {
      if (Object.keys(nodos).length > 0) {
        inicializarCytoscape(); // Inicializar aquí
      }
      
      // Verificar estado de autenticación
      const savedUser = localStorage.getItem('currentUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById("login").style.display = "none";
        document.getElementById("formulario").style.display = "block";
        inicializarCytoscape();
      }
    });

    // Modificar handler de Google Sign-In
    function handleCredentialResponse(response) {
      try {
        document.querySelector('.loading').style.display = 'block';
        
        currentUser = {
          uid: response.credential,
          displayName: 'Usuario' + Math.random().toString(36).substr(2, 5)
        };

        localStorage.setItem('currentUser', JSON.stringify(currentUser));

        document.getElementById("login").style.display = "none";
        document.getElementById("formulario").style.display = "block";

        // Inicializar Cytoscape si no existe
        if (!cy) {
          inicializarCytoscape();
        }

        // Añadir usuario si no existe
        if (!nodos[currentUser.uid]) {
          actualizarNodo(true);
        }

      } catch (error) {
        console.error("Error:", error);
      } finally {
        document.querySelector('.loading').style.display = 'none';
      }
    }

    // Modificar función de actualización de nodo
    function actualizarNodo(inicial = false) {
      if (!cy) return; // Validar existencia de cy

      const url = document.getElementById("contactoURL").value.trim();
      const desc = document.getElementById("descripcion").value.trim();

      if (currentUser?.uid) {
        const nuevoNodo = {
          nombre: currentUser.displayName,
          descripcion: desc,
          url: url,
          position: {
            x: Math.random() * 500,
            y: Math.random() * 500
          }
        };

        nodos[currentUser.uid] = nuevoNodo;
        localStorage.setItem('nodos', JSON.stringify(nodos));

        if (cy.getElementById(currentUser.uid).length > 0) {
          cy.getElementById(currentUser.uid).data({
            label: `${nuevoNodo.nombre}\n${nuevoNodo.descripcion}`,
            href: nuevoNodo.url
          });
        } else {
          cy.add({
            group: 'nodes',
            data: {
              id: currentUser.uid,
              label: `${nuevoNodo.nombre}\n${nuevoNodo.descripcion}`,
              href: nuevoNodo.url
            },
            position: nuevoNodo.position
          });
        }

        cy.layout({ name: 'cose', animate: true }).run();
      }
    }

    // Modificar limpieza al salir
    window.addEventListener('beforeunload', () => {
      if (currentUser?.uid && cy) { // Validar existencia de cy
        delete nodos[currentUser.uid];
        localStorage.setItem('nodos', JSON.stringify(nodos));
        cy.$(`#${currentUser.uid}`).remove();
      }
    });
  
  </script>
</body>
</html>
