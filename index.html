<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoGraph</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: #fafafa;
    }

    #cy {
      width: 100%;
      height: 100vh;
      display: block;
    }

    #formulario {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 10;
    }

    #formulario input {
      display: block;
      margin: 5px 0;
      padding: 6px;
      width: 200px;
    }

    #formulario button {
      padding: 6px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <div id="formulario">
    <input id="nombre" placeholder="Tu nombre" />
    <input id="url" placeholder="Enlace (Telegram, WhatsApp...)" />
    <button onclick="enviarUsuario()">Conectar</button>
  </div>

  <div id="cy"></div>

  <script>
    const socket = io("https://tu-backend.onrender.com"); // Cambia por tu backend

    const cy = cytoscape({
      container: document.getElementById("cy"),
      style: [
        {
          selector: "node",
          style: {
            "background-color": "#4CAF50",
            "label": "data(nombre)",
            "text-valign": "center",
            "color": "#fff",
            "text-outline-width": 2,
            "text-outline-color": "#4CAF50",
            "font-size": "12px",
            "width": "label",
            "height": "label",
            "padding": "10px",
            "shape": "roundrectangle"
          }
        },
        {
          selector: "edge",
          style: {
            "width": 2,
            "line-color": "#ccc",
            "target-arrow-color": "#ccc",
            "target-arrow-shape": "triangle"
          }
        }
      ],
      layout: {
        name: "cose"
      }
    });

    function enviarUsuario() {
      const nombre = document.getElementById("nombre").value;
      const url = document.getElementById("url").value;
      if (!nombre || !url) return;
      const user = { id: nombre, nombre, url };
      socket.emit("nuevo-usuario", user);
      upsertUserNode(user);
    }

    function upsertUserNode(user) {
      const existente = cy.getElementById(user.id);
      if (existente.length > 0) {
        existente.data("url", user.url);
      } else {
        cy.add({
          group: "nodes",
          data: { id: user.id, nombre: user.nombre, url: user.url },
          position: { x: Math.random() * 400, y: Math.random() * 400 }
        });
      }
    }

    socket.on("usuario-conectado", (user) => {
      upsertUserNode(user);
    });

    cy.on("tap click", "node", (evt) => {
      const url = evt.target.data("url");
      if (url && /^https?:\/\//.test(url)) {
        window.open(url, "_blank");
      }
    });
  </script>

</body>
</html>
