<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Red de Conexiones</title>
  <style>
    /* Estilos se mantienen igual */
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #cy { width: 100vw; height: 100vh; }
    #login, #formulario { /* ... */ }
    input, textarea, button { /* ... */ }
    .loading { /* ... */ }
  </style>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="login">
    <div id="g_id_onload"
      data-client_id="TU_CLIENT_ID_GOOGLE"
      data-callback="handleCredentialResponse"
      data-context="use"
      data-ux_mode="popup"
      data-auto_select="true"
      data-itp_support="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
  </div>

  <div id="formulario" style="display: none;">
    <label>¿Dónde te pueden contactar? (URL)</label>
    <input type="text" id="contactoURL" placeholder="https://wa.me/..." />
    <label>¿Qué estás ofreciendo?</label>
    <textarea id="descripcion" placeholder="Clases, asesorías, etc."></textarea>
    <button onclick="actualizarNodo()">Actualizar estado</button>
  </div>

  <div id="cy"></div>
  <div class="loading" style="display: none;">Cargando red...</div>

  <script>
    let cy;
    let currentUser = null;
    let nodos = {};
    let conexiones = {};

    function inicializarCytoscape() {
      cy = cytoscape({
        container: document.getElementById('cy'),
        style: [{
          selector: 'node',
          style: {
            'background-color': '#0074D9',
            'label': 'data(label)',
            'color': '#fff',
            'text-valign': 'center',
            'text-wrap': 'wrap',
            'text-max-width': '150px',
            'font-size': 12,
            'shape': 'roundrectangle',
            'padding': 10,
            'width': 'label',
            'height': 'label',
            'border-width': 2,
            'border-color': '#005fa3'
          }
        }, {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': '#999',
            'curve-style': 'bezier'
          }
        }]
      });

      cy.layout({ name: 'grid', animate: true }).run();

      cy.on('tap', 'node', function(evt) {
        const targetNode = evt.target;
        if (targetNode && currentUser && targetNode.id() !== currentUser.uid) {
          crearConexion(targetNode.id());
        }
      });
    }

    function handleCredentialResponse(response) {
      document.querySelector('.loading').style.display = 'block';
      
      // Simulamos usuario autenticado
      currentUser = {
        uid: response.credential,
        displayName: 'Usuario Demo'
      };

      setTimeout(() => {
        document.getElementById("login").style.display = "none";
        document.getElementById("formulario").style.display = "block";
        inicializarCytoscape();
        cargarDatosIniciales();
        document.querySelector('.loading').style.display = 'none';
      }, 1000);
    }

    function cargarDatosIniciales() {
      // Datos de ejemplo
      const datosEjemplo = {
        'user1': {
          nombre: 'Juan Pérez',
          descripcion: 'Clases de matemáticas',
          url: 'https://wa.me/123'
        },
        'user2': {
          nombre: 'María García',
          descripcion: 'Asesorías de programación',
          url: 'https://wa.me/456'
        }
      };

      actualizarNodos(datosEjemplo);
    }

    function actualizarNodos(nuevosNodos) {
      Object.entries(nuevosNodos).forEach(([id, datos]) => {
        if (!cy.getElementById(id).length) {
          cy.add({
            group: 'nodes',
            data: {
              id: id,
              label: `${datos.nombre}\n${datos.descripcion}\n${datos.url}`
            },
            position: {
              x: Math.random() * 500,
              y: Math.random() * 500
            }
          });
        }
      });
      cy.layout({ name: 'cose', animate: true }).run();
    }

    function actualizarNodo() {
      const url = document.getElementById("contactoURL").value.trim();
      const desc = document.getElementById("descripcion").value.trim();

      if (currentUser) {
        const nuevoNodo = {
          nombre: currentUser.displayName,
          descripcion: desc,
          url: url
        };

        cy.add({
          group: 'nodes',
          data: {
            id: currentUser.uid,
            label: `${nuevoNodo.nombre}\n${nuevoNodo.descripcion}\n${nuevoNodo.url}`
          },
          position: {
            x: Math.random() * 500,
            y: Math.random() * 500
          }
        });

        cy.layout({ name: 'cose', animate: true }).run();
      }
    }

    function crearConexion(targetUID) {
      if (currentUser && targetUID !== currentUser.uid) {
        const conexionId = `${currentUser.uid}_${targetUID}`;
        
        cy.add({
          group: 'edges',
          data: {
            id: conexionId,
            source: currentUser.uid,
            target: targetUID
          }
        });
        
        cy.layout({ name: 'cose', animate: true }).run();
      }
    }

    // Manejo básico de desconexión
    window.addEventListener('beforeunload', () => {
      if (currentUser) {
        cy.$(`#${currentUser.uid}`).remove();
      }
    });
  </script>
</body>
</html>
