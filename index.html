<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cograph</title>
  <style>
    body, html {
      margin: 0; padding: 0;
      font-family: sans-serif;
      height: 100%;
      overflow: hidden;
    }

    #cy {
      width: 100vw;
      height: 100vh;
    }

    #login-info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 8px;
    }

    input, button {
      display: block;
      margin: 5px 0;
      padding: 8px;
      width: 100%;
      font-size: 14px;
    }

    a {
      color: #007bff;
    }
  </style>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="login-info">
  <div id="g_id_onload"
    data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
    data-callback="handleCredentialResponse"
    data-auto_prompt="false">
  </div>
  <div class="g_id_signin"
    data-type="standard"
    data-size="large"
    data-theme="outline"
    data-text="sign_in_with"
    data-shape="rectangular"
    data-logo_alignment="left">
  </div>

  <h3 id="user-name">No autenticado</h3>

  <input type="text" id="urlInput" placeholder="Tu enlace de contacto (Telegram, WhatsApp...)" />
  <textarea id="descInput" rows="3" placeholder="Tu descripción o estado (máx 3 renglones)..."></textarea>
  <button onclick="actualizarEstado()">Actualizar estado</button>
</div>

<div id="cy"></div>

<script>
  const socket = io("https://TU_BACKEND_URL"); // ⚠️ cambia por la URL real

  let usuario = null;
  let urlContacto = "";
  let descripcion = "";

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements: [],
    style: [
      {
        selector: 'node',
        style: {
          'shape': 'roundrectangle',
          'width': 'label',
          'padding': '12px',
          'label': 'data(label)',
          'background-color': '#f9f9f9',
          'border-width': 2,
          'border-color': '#333',
          'font-size': '14px',
          'text-wrap': 'wrap',
          'text-max-width': 160,
        }
      }
    ],
    layout: { name: 'grid' }
  });

  function actualizarEstado() {
    urlContacto = document.getElementById("urlInput").value;
    descripcion = document.getElementById("descInput").value;

    if (usuario) {
      socket.emit("nuevo-usuario", {
        name: usuario.name,
        email: usuario.email,
        contactUrl: urlContacto,
        description: descripcion
      });
    }
  }

  function decodeJwtResponse(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(jsonPayload);
  }

  function handleCredentialResponse(response) {
    usuario = decodeJwtResponse(response.credential);
    document.getElementById("user-name").textContent = usuario.name;

    actualizarEstado(); // envia el nodo inicial
  }

  socket.on("usuarios-actualizados", (usuarios) => {
    cy.elements().remove();

    usuarios.forEach((u) => {
      const texto = `${u.name}\n${u.description || ""}`;
      const node = cy.add({
        group: 'nodes',
        data: {
          id: u.email,
          label: texto,
          href: u.contactUrl || ""
        },
        position: {
          x: Math.random() * 600 + 50,
          y: Math.random() * 400 + 50
        }
      });

      node.on("tap", () => {
        if (u.contactUrl) {
          window.open(u.contactUrl, "_blank");
        }
      });
    });

    cy.layout({ name: 'grid' }).run();
  });
</script>

</body>
</html>
