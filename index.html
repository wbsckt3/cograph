<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Usuarios con LiteGraph y Google Login</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    #mycanvas { width: 100%; height: 100%; display: block; }
    #login-info { position: absolute; top: 10px; left: 10px; background: #fff; padding: 10px; border-radius: 5px; z-index: 10; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/litegraph.js/0.8.2/litegraph.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js/css/litegraph.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="login-info">
    <div id="g_id_onload"
      data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-context="use"
      data-ux_mode="popup"
      data-auto_select="true"
      data-itp_support="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
    <h3 id="user-info">No autenticado</h3>
  </div>

  <canvas id="mycanvas"></canvas>

  <script>
    let graph = new LGraph();
    let canvas = new LGraphCanvas("#mycanvas", graph);
    canvas.bgcolor = "#fafafa";

    // Si ya está autenticado, cargar desde localStorage
    const usuarioGuardado = JSON.parse(localStorage.getItem("usuario"));
    if (usuarioGuardado) {
      agregarNodoUsuario(usuarioGuardado.name, usuarioGuardado.email);
      document.getElementById("user-info").textContent = `Usuario: ${usuarioGuardado.email}`;
      ocultarLogin();
    }

    function handleCredentialResponse(response) {
      const payload = decodeJwtResponse(response.credential);
      console.log("Usuario autenticado:", payload);

      localStorage.setItem("usuario", JSON.stringify(payload));
      agregarNodoUsuario(payload.name, payload.email);

      document.getElementById("user-info").textContent = `Usuario: ${payload.email}`;
      ocultarLogin();
    }

    function decodeJwtResponse(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function agregarNodoUsuario(nombre, email) {
      let node = LiteGraph.createNode("basic/info");
      node.pos = [Math.random() * 400 + 100, Math.random() * 200 + 100];
      node.title = nombre;
      node.setProperty("text", email);
      graph.add(node);
      graph.start();
    }

    function ocultarLogin() {
      document.querySelector(".g_id_signin").style.display = "none";
      document.getElementById("g_id_onload").style.display = "none";
    }
  </script>
</body>
</html>
