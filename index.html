<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Red de Conexiones Interactiva</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; font-family: sans-serif;
    }
    #cy {
      width: 100vw; height: 100vh;
    }
    #login, #formulario {
      position: absolute; z-index: 10;
      top: 10px; left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      max-width: 300px;
    }
    input, textarea, button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      width: 95%;
      margin-bottom: 5px;
    }
    textarea {
      resize: none;
      height: 60px;
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2em;
    }
  </style>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="login">
    <div id="g_id_onload"
      data-client_id="980822676255-vntch0t28qbesul2bp5oc1galtoi8a97.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-context="use"
      data-ux_mode="popup"
      data-auto_select="true"
      data-itp_support="true">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-shape="rectangular"
      data-theme="outline"
      data-text="signin_with"
      data-size="large"
      data-logo_alignment="left">
    </div>
  </div>

  <div id="formulario" style="display: none;">
    <label>¿Dónde te pueden contactar? (URL)</label>
    <input type="text" id="contactoURL" placeholder="https://wa.me/..." />
    <label>¿Qué estás ofreciendo? (máx 3 renglones)</label>
    <textarea id="descripcion" placeholder="Clases, asesorías, networking, etc."></textarea>
    <button onclick="actualizarNodo()">Actualizar estado</button>
  </div>

  <div id="cy"></div>
  <div class="loading" style="display: none;">Cargando red...</div>

  <script>
    let cy;
    let currentUser = null;
    let nodos = JSON.parse(localStorage.getItem('nodos')) || {};
    let conexiones = JSON.parse(localStorage.getItem('conexiones')) || {};

    function inicializarCytoscape() {
      cy = cytoscape({
        container: document.getElementById('cy'),
        style: [{
          selector: 'node',
          style: {
            'background-color': '#0074D9',
            'label': 'data(label)',
            'color': '#fff',
            'text-valign': 'center',
            'text-wrap': 'wrap',
            'text-max-width': '150px',
            'font-size': 12,
            'shape': 'roundrectangle',
            'padding': 10,
            'width': 'label',
            'height': 'label',
            'border-width': 2,
            'border-color': '#005fa3'
          }
        }, {
          selector: 'node[href]',
          style: {
            'border-color': '#00ff00',
            'border-width': 3
          }
        }, {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': '#999',
            'curve-style': 'bezier'
          }
        }]
      });

      // Cargar datos iniciales
      cargarDatosEnRed();

      // Evento para abrir URL
      cy.on('tap', 'node', function(evt) {
        const node = evt.target;
        const href = node.data('href');
        if (href) {
          window.open(href, '_blank');
        }
      });

      // Evento para crear conexiones con doble clic
      cy.on('dbltap', 'node', function(evt) {
        const targetNode = evt.target;
        if (currentUser && targetNode.id() !== currentUser.uid) {
          crearConexion(targetNode.id());
        }
      });

      cy.layout({ name: 'cose', animate: true }).run();
    }

    function handleCredentialResponse(response) {
      document.querySelector('.loading').style.display = 'block';
      
      // Simular usuario autenticado
      currentUser = {
        uid: response.credential,
        displayName: response.clientId // Nombre se puede extraer del JWT si es necesario
      };

      // Mostrar formulario
      setTimeout(() => {
        document.getElementById("login").style.display = "none";
        document.getElementById("formulario").style.display = "block";
        
        // Agregar usuario actual si no existe
        if (!nodos[currentUser.uid]) {
          actualizarNodo(true);
        }
        
        inicializarCytoscape();
        document.querySelector('.loading').style.display = 'none';
      }, 500);
    }

    function cargarDatosEnRed() {
      // Cargar nodos
      Object.entries(nodos).forEach(([id, datos]) => {
        cy.add({
          group: 'nodes',
          data: {
            id: id,
            label: `${datos.nombre}\n${datos.descripcion}`,
            href: datos.url
          },
          position: datos.position
        });
      });

      // Cargar conexiones
      Object.values(conexiones).forEach(conexion => {
        cy.add({
          group: 'edges',
          data: {
            id: conexion.id,
            source: conexion.source,
            target: conexion.target
          }
        });
      });
    }

    function actualizarNodo(inicial = false) {
      const url = document.getElementById("contactoURL").value.trim();
      const desc = document.getElementById("descripcion").value.trim();

      if (currentUser) {
        const nuevoNodo = {
          nombre: currentUser.displayName,
          descripcion: desc,
          url: url,
          position: {
            x: Math.random() * 500,
            y: Math.random() * 500
          }
        };

        // Actualizar datos locales
        nodos[currentUser.uid] = nuevoNodo;
        localStorage.setItem('nodos', JSON.stringify(nodos));

        // Actualizar vista
        if (!inicial) {
          cy.getElementById(currentUser.uid).data({
            label: `${nuevoNodo.nombre}\n${nuevoNodo.descripcion}`,
            href: nuevoNodo.url
          });
        } else {
          cy.add({
            group: 'nodes',
            data: {
              id: currentUser.uid,
              label: `${nuevoNodo.nombre}\n${nuevoNodo.descripcion}`,
              href: nuevoNodo.url
            },
            position: nuevoNodo.position
          });
        }

        cy.layout({ name: 'cose', animate: true }).run();
      }
    }

    function crearConexion(targetUID) {
      if (currentUser && targetUID !== currentUser.uid) {
        const conexionId = `${currentUser.uid}_${targetUID}`;
        
        // Guardar conexión
        conexiones[conexionId] = {
          id: conexionId,
          source: currentUser.uid,
          target: targetUID
        };
        localStorage.setItem('conexiones', JSON.stringify(conexiones));

        // Añadir conexión a la vista
        cy.add({
          group: 'edges',
          data: conexiones[conexionId]
        });
        
        cy.layout({ name: 'cose', animate: true }).run();
      }
    }

    // Inicializar al cargar
    window.addEventListener('load', () => {
      if (Object.keys(nodos).length > 0) {
        inicializarCytoscape();
      }
    });

    // Limpiar al salir
    window.addEventListener('beforeunload', () => {
      if (currentUser) {
        delete nodos[currentUser.uid];
        localStorage.setItem('nodos', JSON.stringify(nodos));
      }
    });
  </script>
</body>
</html>
